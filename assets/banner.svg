<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="clayShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(1deg); }
      }

      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.15); }
      }

      @keyframes scanline {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      @keyframes textCycle {
        0%, 45% { opacity: 1; }
        50%, 95% { opacity: 0; }
        100% { opacity: 1; }
      }

      .floating-logo {
        animation: floatSlow 4s ease-in-out infinite;
        transform-origin: center;
      }

      .glow-orb-1 {
        animation: pulseGlow 6s ease-in-out infinite;
        transform-origin: 180px 80px;
      }

      .glow-orb-2 {
        animation: pulseGlow 7s ease-in-out infinite reverse;
        transform-origin: 700px 200px;
      }

      .cursor-blink {
        animation: blink 1s step-start infinite;
      }

      .badge-chip {
        transition: transform 0.3s ease;
      }
      .badge-chip:hover {
        transform: translateY(-2px);
      }
    </style>
  </defs>

  <!-- Outer Card Frame (Claymorphic) -->
  <rect x="10" y="10" width="860" height="260" rx="24" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" filter="url(#clayShadow)" />

  <!-- Inner ambient glowing orbs -->
  <circle class="glow-orb-1" cx="180" cy="80" r="140" fill="url(#purpleGlow)" filter="url(#neonGlow)" />
  <circle class="glow-orb-2" cx="720" cy="180" r="160" fill="url(#cyanGlow)" filter="url(#neonGlow)" />

  <!-- Inner Clay Rim Highlight -->
  <rect x="12" y="12" width="856" height="256" rx="22" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- 3D Database Logo Emblem (Left) -->
  <g class="floating-logo" transform="translate(60, 65)">
    <!-- Base 3D Clay Icon Cushion -->
    <rect x="0" y="0" width="100" height="100" rx="26" fill="#182033" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
    <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#purpleGlow)" opacity="0.3" />

    <!-- Database Stack Graphic -->
    <g transform="translate(26, 22)">
      <!-- Top disc -->
      <ellipse cx="24" cy="10" rx="24" ry="9" fill="#8b5cf6" />
      <ellipse cx="24" cy="9" rx="22" ry="7" fill="#a78bfa" />
      
      <!-- Middle segment -->
      <path d="M 0,10 V 26 C 0,31 24,35 24,35 C 24,35 48,31 48,26 V 10" fill="#7c3aed" />
      <ellipse cx="24" cy="26" rx="24" ry="9" fill="#8b5cf6" />
      
      <!-- Bottom segment -->
      <path d="M 0,26 V 42 C 0,47 24,51 24,51 C 24,51 48,47 48,42 V 26" fill="#6d28d9" />
      <ellipse cx="24" cy="42" rx="24" ry="9" fill="#7c3aed" />

      <!-- Sparkle star -->
      <polygon points="40,2 42,7 47,9 42,11 40,16 38,11 33,9 38,7" fill="#38bdf8" />
    </g>
  </g>

  <!-- Title & Subtitles (Right) -->
  <g transform="translate(195, 75)">
    <!-- Platform Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="168" height="24" rx="12" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1" />
      <circle cx="12" cy="12" r="4" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="24" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#c084fc" letter-spacing="0.5">LANGGRAPH • AST SHIELD</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="url(#textGrad)" letter-spacing="-0.8">
      NL2DB PLATFORM
    </text>

    <!-- Animated Subtitle / Prompt Simulation -->
    <g transform="translate(0, 85)">
      <text font-family="'JetBrains Mono', monospace, Consolas, sans-serif" font-size="15" fill="#94a3b8" font-weight="500">
        <tspan fill="#38bdf8">&gt;</tspan> Natural Language to Multi-Database Query Engine
        <tspan fill="#8b5cf6" class="cursor-blink">|</tspan>
      </text>
      <text y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">
        Deterministic AST Security • NVIDIA NIM LLM • SQLite • Postgres • MySQL • MongoDB
      </text>
    </g>

    <!-- Supported Database Dialect Pills -->
    <g transform="translate(0, 140)">
      <!-- SQLite -->
      <g class="badge-chip" transform="translate(0, 0)">
        <rect width="84" height="26" rx="8" fill="#132238" stroke="#38bdf8" stroke-width="1" />
        <circle cx="12" cy="13" r="3.5" fill="#38bdf8" />
        <text x="22" y="17" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#e0f2fe">SQLite</text>
      </g>

      <!-- PostgreSQL -->
      <g class="badge-chip" transform="translate(94, 0)">
        <rect width="105" height="26" rx="8" fill="#201a3d" stroke="#a78bfa" stroke-width="1" />
        <circle cx="12" cy="13" r="3.5" fill="#a78bfa" />
        <text x="22" y="17" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#ede9fe">PostgreSQL</text>
      </g>

      <!-- MySQL -->
      <g class="badge-chip" transform="translate(209, 0)">
        <rect width="82" height="26" rx="8" fill="#312015" stroke="#fb923c" stroke-width="1" />
        <circle cx="12" cy="13" r="3.5" fill="#fb923c" />
        <text x="22" y="17" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffedd5">MySQL</text>
      </g>

      <!-- MongoDB -->
      <g class="badge-chip" transform="translate(301, 0)">
        <rect width="98" height="26" rx="8" fill="#132b22" stroke="#34d399" stroke-width="1" />
        <circle cx="12" cy="13" r="3.5" fill="#34d399" />
        <text x="22" y="17" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#d1fae5">MongoDB</text>
      </g>

      <!-- Claymorphic 3D Tag -->
      <g class="badge-chip" transform="translate(410, 0)">
        <rect width="124" height="26" rx="8" fill="#261b36" stroke="#c084fc" stroke-width="1" />
        <circle cx="12" cy="13" r="3.5" fill="#c084fc" />
        <text x="22" y="17" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#f5d0fe">Claymorphism 3D</text>
      </g>
    </g>
  </g>
</svg>
