<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#060912" />
    </linearGradient>

    <linearGradient id="neonLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <style>
      @keyframes dashMove {
        to {
          stroke-dashoffset: -40;
        }
      }

      @keyframes nodePulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px rgba(139, 92, 246, 0.4)); }
        50% { transform: scale(1.06); filter: drop-shadow(0 0 12px rgba(139, 92, 246, 0.8)); }
      }

      @keyframes pulseGreen {
        0%, 100% { filter: drop-shadow(0 0 4px rgba(16, 185, 129, 0.4)); }
        50% { filter: drop-shadow(0 0 12px rgba(16, 185, 129, 0.9)); }
      }

      .pulse-stream {
        stroke-dasharray: 6 6;
        animation: dashMove 1.5s linear infinite;
      }

      .pulse-recovery {
        stroke-dasharray: 4 4;
        animation: dashMove 1s linear infinite reverse;
      }

      .node-box {
        transition: transform 0.2s ease;
      }
      .node-box:hover {
        transform: translateY(-3px);
      }
    </style>
  </defs>

  <!-- Container Frame -->
  <rect x="5" y="5" width="890" height="230" rx="18" fill="url(#pipeBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Title Header -->
  <g transform="translate(30, 32)">
    <circle cx="6" cy="6" r="4" fill="#8b5cf6">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="18" y="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#c084fc" letter-spacing="1">
      LANGGRAPH MULTI-AGENT PIPELINE &amp; AST RECOVERY WORKFLOW
    </text>
  </g>

  <!-- Connecting animated data streams -->
  <g fill="none" stroke-width="2.5">
    <!-- Stream 1 to 2 -->
    <path d="M 125,125 L 180,125" stroke="#38bdf8" opacity="0.4" />
    <path d="M 125,125 L 180,125" stroke="#38bdf8" class="pulse-stream" />

    <!-- Stream 2 to 3 -->
    <path d="M 280,125 L 335,125" stroke="#a855f7" opacity="0.4" />
    <path d="M 280,125 L 335,125" stroke="#a855f7" class="pulse-stream" />

    <!-- Stream 3 to 4 -->
    <path d="M 435,125 L 490,125" stroke="#ec4899" opacity="0.4" />
    <path d="M 435,125 L 490,125" stroke="#ec4899" class="pulse-stream" />

    <!-- Stream 4 to 5 (Pass) -->
    <path d="M 590,125 L 645,125" stroke="#10b981" opacity="0.4" />
    <path d="M 590,125 L 645,125" stroke="#10b981" class="pulse-stream" />

    <!-- Stream 5 to 6 -->
    <path d="M 745,125 L 790,125" stroke="#38bdf8" opacity="0.4" />
    <path d="M 745,125 L 790,125" stroke="#38bdf8" class="pulse-stream" />

    <!-- Loop: Stream 4 back to 3 on Syntax Error (Self-Healing Recovery) -->
    <path d="M 540,95 C 540,55 385,55 385,95" stroke="#f59e0b" stroke-width="2" opacity="0.3" />
    <path d="M 540,95 C 540,55 385,55 385,95" stroke="#f59e0b" stroke-width="2" class="pulse-recovery" />
    <text x="462" y="50" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#f59e0b" text-anchor="middle">
      Auto-Recovery Loop (Max 2 Retries)
    </text>
  </g>

  <!-- Node 1: Intent -->
  <g class="node-box" transform="translate(35, 95)">
    <rect width="90" height="60" rx="12" fill="#131e33" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="45" cy="20" r="10" fill="#0284c7" opacity="0.3" />
    <text x="45" y="24" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#38bdf8" text-anchor="middle">🎯 INTENT</text>
    <text x="45" y="44" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">Classifier</text>
  </g>

  <!-- Node 2: Schema Filter -->
  <g class="node-box" transform="translate(180, 95)">
    <rect width="100" height="60" rx="12" fill="#1b1c3a" stroke="#8b5cf6" stroke-width="1.5" />
    <circle cx="50" cy="20" r="10" fill="#7c3aed" opacity="0.3" />
    <text x="50" y="24" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#a78bfa" text-anchor="middle">🗂️ SCHEMA</text>
    <text x="50" y="44" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">Pruning Engine</text>
  </g>

  <!-- Node 3: LLM Synthesis -->
  <g class="node-box" transform="translate(335, 95)">
    <rect width="100" height="60" rx="12" fill="#29163b" stroke="#c084fc" stroke-width="1.5" />
    <circle cx="50" cy="20" r="10" fill="#a855f7" opacity="0.3" />
    <text x="50" y="24" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#e9d5ff" text-anchor="middle">⚡ NVIDIA NIM</text>
    <text x="50" y="44" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">Query Synthesizer</text>
  </g>

  <!-- Node 4: AST Guardrail -->
  <g class="node-box" transform="translate(490, 95)">
    <rect width="100" height="60" rx="12" fill="#2d1522" stroke="#f43f5e" stroke-width="1.5" />
    <circle cx="50" cy="20" r="10" fill="#e11d48" opacity="0.3" />
    <text x="50" y="24" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#fda4af" text-anchor="middle">🛡️ AST SHIELD</text>
    <text x="50" y="44" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">sqlglot Validator</text>
  </g>

  <!-- Node 5: Safe Execution -->
  <g class="node-box" transform="translate(645, 95)">
    <rect width="100" height="60" rx="12" fill="#0f2921" stroke="#10b981" stroke-width="1.5" />
    <circle cx="50" cy="20" r="10" fill="#059669" opacity="0.3" />
    <text x="50" y="24" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#6ee7b7" text-anchor="middle">🚀 EXECUTE</text>
    <text x="50" y="44" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">Async DB Driver</text>
  </g>

  <!-- Node 6: AI Summary -->
  <g class="node-box" transform="translate(790, 95)">
    <rect width="90" height="60" rx="12" fill="#132338" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="45" cy="20" r="10" fill="#0284c7" opacity="0.3" />
    <text x="45" y="24" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#7dd3fc" text-anchor="middle">📊 INSIGHTS</text>
    <text x="45" y="44" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">Executive AI</text>
  </g>

  <!-- Footer Indicator -->
  <g transform="translate(450, 205)" text-anchor="middle">
    <text font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">
      100% Deterministic Security • Zero Mutation Risk • Dialects: SQLite | PostgreSQL | MySQL | MongoDB
    </text>
  </g>
</svg>
